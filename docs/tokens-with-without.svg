<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="760" height="270" rx="12" fill="#0d1117"/>
<text x="24" y="32" fill="#f0f6fc" font-size="18" font-weight="700">Tokens sent: without CMI vs with CMI (millions)</text>
<text x="24" y="52" fill="#8b949e" font-size="12">On a subscription this is what counts: fewer tokens, so the same usage limit goes further.</text>
<text x="24" y="94" fill="#c9d1d9" font-size="13">All 26 sessions</text>
<rect x="250" y="78" width="360.0" height="22" rx="4" fill="#6e7681"/><text x="618.0" y="94" fill="#8b949e" font-size="12">878M</text>
<rect x="250" y="106" width="253.2" height="22" rx="4" fill="#3fb950"/><text x="511.2" y="122" fill="#f0f6fc" font-size="12" font-weight="700">618M  −30%  (≈1.4× further)</text>
<text x="24" y="178" fill="#c9d1d9" font-size="13">The 15 sessions of 100+ requests</text>
<rect x="250" y="162" width="348.3" height="22" rx="4" fill="#6e7681"/><text x="606.3" y="178" fill="#8b949e" font-size="12">850M</text>
<rect x="250" y="190" width="242.8" height="22" rx="4" fill="#3fb950"/><text x="500.8" y="206" fill="#f0f6fc" font-size="12" font-weight="700">592M  −30%  (≈1.4× further)</text>
<text x="24" y="258" fill="#8b949e" font-size="11.5">Same 26 real sessions, offline replay of CMI 1.12.2. Tokens sent, not messages: plans do not publish how tokens count.</text></svg>