<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="760" height="270" rx="12" fill="#0d1117"/>
<text x="24" y="32" fill="#f0f6fc" font-size="18" font-weight="700">Tokens sent: without CMI vs with CMI (millions)</text>
<text x="24" y="52" fill="#8b949e" font-size="12">On a subscription this is what counts: fewer tokens, so the same usage limit goes further.</text>
<text x="24" y="94" fill="#c9d1d9" font-size="13">All 26 sessions</text>
<rect x="250" y="78" width="360.0" height="22" rx="4" fill="#6e7681"/><text x="618.0" y="94" fill="#8b949e" font-size="12">572M</text>
<rect x="250" y="106" width="259.4" height="22" rx="4" fill="#3fb950"/><text x="517.4" y="122" fill="#f0f6fc" font-size="12" font-weight="700">412M  −28%  (≈1.4× further)</text>
<text x="24" y="178" fill="#c9d1d9" font-size="13">The 15 sessions of 100+ requests</text>
<rect x="250" y="162" width="342.0" height="22" rx="4" fill="#6e7681"/><text x="600.0" y="178" fill="#8b949e" font-size="12">544M</text>
<rect x="250" y="190" width="242.5" height="22" rx="4" fill="#3fb950"/><text x="500.5" y="206" fill="#f0f6fc" font-size="12" font-weight="700">385M  −29%  (≈1.4× further)</text>
<text x="24" y="258" fill="#8b949e" font-size="11.5">Same 26 real sessions, offline replay of CMI 1.11.0. Providers do not publish how a token counts against a plan: this is tokens sent, not messages.</text></svg>