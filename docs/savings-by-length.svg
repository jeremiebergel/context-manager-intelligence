<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="760" height="406" rx="12" fill="#0d1117"/>
<text x="24" y="32" fill="#f0f6fc" font-size="18" font-weight="700">Savings start after 30 requests</text>
<text x="24" y="52" fill="#8b949e" font-size="12">Same 26 real sessions, grouped by length. Green = fewer tokens sent, blue = lower modelled API cost.</text>
<text x="24" y="104" fill="#c9d1d9" font-size="13">Under 30 requests</text>
<text x="24" y="122" fill="#8b949e" font-size="11.5">1 session</text>
<text x="250" y="112" fill="#8b949e" font-size="12" font-weight="700">left as is: 0%</text>
<text x="24" y="174" fill="#c9d1d9" font-size="13">30 to 99 requests</text>
<text x="24" y="192" fill="#8b949e" font-size="11.5">10 sessions</text>
<rect x="250" y="160" width="99.5" height="18" rx="4" fill="#3fb950"/><text x="357.5" y="174" fill="#3fb950" font-size="12" font-weight="700">−12% tokens</text>
<rect x="250" y="184" width="86.8" height="18" rx="4" fill="#58a6ff"/><text x="344.8" y="198" fill="#58a6ff" font-size="12" font-weight="700">−11% cost</text>
<text x="24" y="244" fill="#c9d1d9" font-size="13">100 to 299 requests</text>
<text x="24" y="262" fill="#8b949e" font-size="11.5">10 sessions</text>
<rect x="250" y="230" width="272.4" height="18" rx="4" fill="#3fb950"/><text x="530.4" y="244" fill="#3fb950" font-size="12" font-weight="700">−33% tokens</text>
<rect x="250" y="254" width="229.9" height="18" rx="4" fill="#58a6ff"/><text x="487.9" y="268" fill="#58a6ff" font-size="12" font-weight="700">−28% cost</text>
<text x="24" y="314" fill="#c9d1d9" font-size="13">300 requests and more</text>
<text x="24" y="332" fill="#8b949e" font-size="11.5">5 sessions</text>
<rect x="250" y="300" width="244.3" height="18" rx="4" fill="#3fb950"/><text x="502.3" y="314" fill="#3fb950" font-size="12" font-weight="700">−30% tokens</text>
<rect x="250" y="324" width="202.6" height="18" rx="4" fill="#58a6ff"/><text x="460.6" y="338" fill="#58a6ff" font-size="12" font-weight="700">−25% cost</text>
<text x="24" y="388" fill="#8b949e" font-size="11.5">Offline replay of CMI 1.12.2, weighted by tokens. Before 30 requests CMI only shortens once the provider cache has expired.</text></svg>